[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = false
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./launch-params.json" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "forge-std/=lib/v4-periphery/lib/v4-core/lib/forge-std/src/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "@openzeppelin/contracts/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
]

[fuzz]
runs = 1000

[rpc_endpoints]
# No endpoint is hardcoded. Set these in contracts/.env (see .env.example).
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[lint]
# Launch windows are timestamp-based by design; a few seconds of sequencer drift does not matter.
exclude_lints = ["block-timestamp"]
